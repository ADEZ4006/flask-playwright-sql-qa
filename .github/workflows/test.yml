name: Test

on: [push]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.13"
            - run: pip install -r requirements.txt
            - run: playwright install -- with-deps chromium
            - run: python paso1_crear_base.py
            - run: |
               python app.py &
               sleep 5
            - run: pytest